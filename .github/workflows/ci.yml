name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The fleet's CI shape (go-fft/fft): a 100% statement-coverage gate over every
# package on three operating systems, then the test binary on six 64-bit
# architectures (two native, four under qemu-user), then cross-builds for the
# 32-bit and wasm targets. Every fixture the tests read is //go:embed-ded, so
# the test binary runs anywhere without the source tree.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go version
      # Not on Windows: its checkout converts line endings to CRLF, and gofmt
      # then flags every file. Formatting does not depend on the OS.
      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  readme-figure:
    name: the README figure is what its code draws
    # docs/readme.svg is generated by tools/compare/readme from this tree. v0.1.0
    # shipped one drawn by an earlier state of the code (its x tick labels sat
    # 1 px off what the tagged code draws); regenerating and comparing byte for
    # byte keeps the README from showing anything the library does not do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Regenerate and compare
        run: |
          cd tools/compare
          go run ./readme > /tmp/readme.svg
          cmp /tmp/readme.svg ../../docs/readme.svg || {
            echo "::error::docs/readme.svg is stale: run (cd tools/compare && go run ./readme > ../../docs/readme.svg)"; exit 1; }

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go env GOARCH
      - run: |
          go vet ./...
          go test ./...

  # qemu-user runs the test binary of every package on the targets without a
  # hosted runner. s390x is the one big-endian target: the font tables, the
  # PNG encoder and the colormap bytes all have to come out the same there.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Vet + test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...

  # 32-bit and wasm: everything must build (CGO_ENABLED=0), and the linux/386
  # test binaries must build too.
  cross:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Build for 386, arm, js/wasm, wasip1/wasm
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=386 go test -c -o /dev/null .
          GOOS=linux GOARCH=arm go build ./...
          GOOS=js GOARCH=wasm go build ./...
          GOOS=wasip1 GOARCH=wasm go build ./...
      - name: Run the tests on linux/386
        run: GOARCH=386 go test ./...
